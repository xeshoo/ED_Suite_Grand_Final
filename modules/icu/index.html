<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=overlays-content">
<meta name="theme-color" content="#0b1b2b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="../../icons/icon-192.png">
<link rel="apple-touch-icon" href="../../icons/icon-192.png">
<title>ICU Admission Suite</title>
<link rel="manifest" href="../../manifest.json">
<script src="../../shared/docx-lite.js" defer></script>
<script src="../../shared/clinical-calc.js" defer></script>
<script src="../../shared/autosave.js"></script>
<style>
:root{
  --navy:#0b1b2b;
  --navy2:#132b40;
  --teal:#0f8a8a;
  --teal-d:#0b6868;
  --amber:#d98e2b;
  --red:#b8412f;
  --paper:#f6f7f5;
  --ink:#1b2530;
  --ink-soft:#5b6b7a;
  --line:#dbe2e6;
  --mono:'SF Mono',Consolas,'Courier New',monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;font-size:15px;line-height:1.45;padding-bottom:78px;}
h1,h2,h3{font-family:'Georgia',serif;margin:0;}

/* Header */
header{background:var(--navy);color:#eef3f5;padding:14px 16px 10px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px rgba(0,0,0,.25);}
.hdr-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-top h1{font-size:19px;letter-spacing:.3px;}
.hdr-sub{font-size:11px;color:#9db3c2;text-transform:uppercase;letter-spacing:1px;margin-top:2px;}
.pulse{width:9px;height:9px;border-radius:50%;background:var(--teal);box-shadow:0 0 0 0 rgba(15,138,138,.6);animation:pulse 2s infinite;flex-shrink:0;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(15,138,138,.55);}70%{box-shadow:0 0 0 8px rgba(15,138,138,0);}100%{box-shadow:0 0 0 0 rgba(15,138,138,0);}}

/* Tab nav - horizontal scroll */
.tabbar{display:flex;overflow-x:auto;gap:6px;margin-top:12px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tabbar::-webkit-scrollbar{display:none;}
.tab-btn{flex:0 0 auto;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);color:#c8d6de;padding:8px 14px;border-radius:20px;font-size:12.5px;font-weight:500;white-space:nowrap;cursor:pointer;transition:all .15s;}
.tab-btn:active{transform:scale(.95);}
.tab-btn.active{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}

main{max-width:760px;margin:0 auto;padding:14px 12px 20px;}
.section{display:none;animation:fade .15s ease;}
.section.active{display:block;}
@keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px 16px 18px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04);}
.card h2{font-size:15px;color:var(--navy2);border-bottom:2px solid var(--teal);padding-bottom:8px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.card h2 .idx{background:var(--navy2);color:#fff;font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;}
.subhead{font-size:12.5px;font-weight:700;color:var(--teal-d);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
.subhead:first-child{margin-top:0;}

label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:3px;font-weight:600;}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;font-size:16px;background:#fbfcfc;color:var(--ink);font-family:inherit;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(15,138,138,.12);}
textarea{resize:vertical;min-height:52px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px;}
.row4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.field{margin-bottom:10px;}
@media(max-width:480px){.row3{grid-template-columns:1fr 1fr;}.row4{grid-template-columns:1fr 1fr;}}

.chip-group{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.chip{border:1px solid var(--line);background:#fbfcfc;padding:7px 13px;border-radius:16px;font-size:13px;cursor:pointer;user-select:none;transition:all .15s;font-weight:500;}
.chip:active{transform:scale(.95);}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600;}
.chip.on.crit{background:var(--red);border-color:var(--red);}

.calc-box{background:var(--navy);color:#eef3f5;border-radius:12px;padding:14px 16px;margin-top:10px;}
.calc-box .score-row{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px;}
.calc-box .score-val{font-family:var(--mono);font-size:28px;font-weight:700;color:var(--teal);}
.calc-box .score-label{font-size:11px;color:#9db3c2;text-transform:uppercase;letter-spacing:.5px;}
.calc-box .interp{font-size:12.5px;color:#cfe0e8;margin-top:6px;}
.badge{display:inline-block;padding:3px 10px;border-radius:8px;font-size:11px;font-weight:700;margin-left:6px;}
.badge.low{background:#1f6b4a;color:#d8f5e5;}
.badge.mid{background:var(--amber);color:#2a1c02;}
.badge.high{background:var(--red);color:#fde;}

.note{font-size:11.5px;color:var(--ink-soft);background:#f0f4f2;border-left:3px solid var(--teal);padding:8px 11px;border-radius:6px;margin-top:8px;}
.flag{font-size:11.5px;color:#7a2418;background:#fbeae6;border-left:3px solid var(--red);padding:8px 11px;border-radius:6px;margin-top:8px;}

table.mini{width:100%;border-collapse:collapse;font-size:13px;}
table.mini th{text-align:left;font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;padding:5px 7px;border-bottom:1px solid var(--line);}
table.mini td{padding:5px 7px;border-bottom:1px solid #eef1f1;}
table.mini input{padding:6px 7px;font-size:16px;}

.bundle-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f1;}
.bundle-item:last-child{border-bottom:none;}
.bundle-item input[type=checkbox]{width:20px;height:20px;margin-top:3px;flex-shrink:0;accent-color:var(--teal);}
.bundle-item .txt b{color:var(--navy2);}
.bundle-item .txt textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:6px 8px;background:#fbfcfc;font-family:inherit;color:var(--ink);}

/* Footer action bar */
.footbar{position:fixed;bottom:0;left:0;right:0;background:var(--navy);display:flex;gap:6px;padding:10px 8px;box-shadow:0 -2px 12px rgba(0,0,0,.3);z-index:60;}
.footbar button{flex:1;background:rgba(255,255,255,.08);color:#e8eef1;border:1px solid rgba(255,255,255,.15);padding:10px 4px;border-radius:10px;font-size:11px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;transition:background .15s,transform .1s;}
.footbar button:active{transform:scale(.94);background:rgba(255,255,255,.15);}
.footbar button.primary{background:var(--teal);border-color:var(--teal);}
.footbar button.primary:active{background:var(--teal-d);}
.footbar button svg{width:18px;height:18px;}

.progress-wrap{height:4px;background:rgba(255,255,255,.1);border-radius:2px;margin-top:10px;overflow:hidden;}
.score-strip{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap;}
.score-strip .pill{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);border-radius:14px;padding:4px 12px;font-size:11px;color:#cfe0e8;font-family:var(--mono);}
.score-strip .pill b{color:#fff;}
.score-strip .pill.warn{background:rgba(217,142,43,.25);border-color:var(--amber);}
.score-strip .pill.crit{background:rgba(184,65,47,.3);border-color:var(--red);}
.progress-bar{height:100%;background:linear-gradient(90deg,var(--teal),#0fb8a5);width:0%;transition:width .3s ease;}

/* Print */
@media print{
  header,.footbar,.tabbar{display:none !important;}
  body{padding:0;background:#fff;}
  .section{display:block !important;page-break-inside:avoid;}
  .card{border:1px solid #999;box-shadow:none;break-inside:avoid;margin-bottom:10px;}
  .calc-box{background:#eee !important;color:#000 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
  .calc-box .score-val{color:#000;}
  main{max-width:100%;padding:0;}
}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--navy2);color:#fff;padding:12px 20px;border-radius:24px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 4px 16px rgba(0,0,0,.2);}
.toast.show{opacity:1;}

.margin-panel{position:fixed;bottom:70px;left:10px;right:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 -4px 20px rgba(0,0,0,.2);z-index:65;flex-direction:column;gap:8px;}
.margin-panel .mp-title{font-size:12.5px;font-weight:700;color:var(--navy2);}
.margin-panel .mp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.margin-panel .mp-grid label{font-size:11px;color:var(--ink-soft);font-weight:600;}
.margin-panel .mp-grid input{width:100%;margin-top:3px;padding:7px 8px;border:1px solid var(--line);border-radius:6px;font-size:16px;}
.margin-panel .mp-note{font-size:11px;color:var(--ink-soft);line-height:1.35;}
.margin-panel .mp-done{background:var(--teal);color:#fff;border:none;padding:9px;border-radius:7px;font-weight:700;font-size:13px;}
</style>
</head>
<body>

<header>
  <div class="hdr-top">
    <a href="../../index.html" style="background:rgba(255,255,255,0.08);color:#eef3f5;border:1px solid rgba(255,255,255,0.15);padding:7px 14px;border-radius:20px;font-size:12px;text-decoration:none;white-space:nowrap;transition:background .15s">⌂ ED Suite</a>
    <div>
      <h1>ICU Admission Suite</h1>
      <div class="hdr-sub"><span class="pulse" style="display:inline-block;vertical-align:middle;margin-right:5px;"></span>Digital admission note &amp; severity scoring</div>
    </div>
  </div>
  <div class="tabbar" id="tabbar"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progressBar"></div></div>
  <div class="score-strip" id="scoreStrip"></div>
</header>

<main id="main"></main>

<div class="margin-panel" id="marginPanel" style="display:none;">
  <div class="mp-title">Print margins (mm) — tune to match your letterhead stock</div>
  <div class="mp-grid">
    <label>Top<input type="number" min="0" max="80" step="0.5" value="65" oninput="updateMargin('top',this.value)"></label>
    <label>Left<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('left',this.value)"></label>
    <label>Right<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('right',this.value)"></label>
    <label>Bottom<input type="number" min="0" max="80" step="0.5" value="12" oninput="updateMargin('bottom',this.value)"></label>
  </div>
  <div class="mp-note">Set <b>Top</b> margin to clear your hospital letterhead header (~65mm / 2.5 inches). Adjust <b>Left</b> if paper has a ruled border. Values are remembered for this session.</div>
  <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-soft);font-weight:600;margin-top:2px;flex-wrap:wrap;">
    <label style="display:flex;align-items:center;gap:6px;margin:0;"><input type="checkbox" id="hwToggle" onchange="HW_STYLE=this.checked;document.getElementById('hwFontSel').style.display=this.checked?'inline-block':'none';" style="width:16px;height:16px;margin:0;"> \u270D\uFE0F Handwritten style (Print/PDF only — needs internet on first use)</label>
    <select id="hwFontSel" onchange="HW_FONT_CHOICE=this.value;" style="display:none;font-size:12px;padding:2px 6px;">
      <option value="kalam">Kalam</option>
      <option value="caveat">Caveat</option>
    </select>
  </div>
  <button class="mp-done" onclick="toggleMarginPanel()">Done</button>
</div>

<div class="footbar">
  <button onclick="toggleMarginPanel()" title="Print margins">⚙️<span>Margins</span></button>
  <button class="primary" onclick="doPrint()">🖨️<span>Print / PDF</span></button>
  <button onclick="exportWord()">📄<span>Word</span></button>
  <button onclick="copySummary()">📋<span>Copy Note</span></button>
  <button onclick="resetAll()">↺<span>Reset</span></button>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   ICU ADMISSION SUITE - app logic
   ============================================================ */

const TABS = [
  {id:'id',   label:'1 · ID / Admit'},
  {id:'dx',   label:'2 · Diagnosis'},
  {id:'hist', label:'3 · History'},
  {id:'exam', label:'4 · Exam / Vitals'},
  {id:'labs', label:'5 · Investigations'},
  {id:'scores',label:'6 · Severity Scores'},
  {id:'ethics',label:'7 · Consent / Code'},
  {id:'plan', label:'8 · Management Plan'},
  {id:'bundle',label:'9 · Care Bundle'},
  {id:'sbar', label:'10 · Handover'},
  {id:'sign', label:'11 · Signatures'}
];

function chip(name, val, crit){
  return `<span class="chip${crit?' data-crit':''}" data-group="${name}" data-val="${val}" role="button" tabindex="0" aria-pressed="false" onclick="toggleChip(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChip(this)}">${val}</span>`;
}
function chipGroup(name, options, critSet){
  critSet = critSet || [];
  return `<div class="chip-group" id="grp_${name}" role="group" aria-label="${esc(name)} options">` + options.map(o=>{
    const isCrit = critSet.includes(o);
    return `<span class="chip${isCrit?' crit-candidate':''}" data-group="${name}" role="button" tabindex="0" aria-pressed="false" onclick="toggleChip(this)" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();toggleChip(this)}">${o}</span>`;
  }).join('') + `</div>`;
}
function toggleChip(el){
  const group = el.dataset.group;
  const wrap = el.parentElement;
  if(wrap.dataset.multi === '1'){
    el.classList.toggle('on');
    if(el.classList.contains('crit-candidate')) el.classList.toggle('crit', el.classList.contains('on'));
    el.setAttribute('aria-pressed', el.classList.contains('on') ? 'true' : 'false');
  } else {
    const wasOn = el.classList.contains('on');
    [...wrap.children].forEach(c=>{c.classList.remove('on');c.classList.remove('crit');c.setAttribute('aria-pressed','false');});
    if(!wasOn){
      el.classList.add('on');
      if(el.classList.contains('crit-candidate')) el.classList.add('crit');
      el.setAttribute('aria-pressed','true');
    }
  }
  updateProgress();
  if(group==='indications') renderICUCriteriaFlag();
  if(group==='arf' || group==='apchronic') calcAPACHE();
  if(group==='ventpreset') renderVentSuggestion();
  if(group==='stmorph'){ /* informational only, no scoring */ }
}
function getChipValue(name, multi){
  const wrap = document.getElementById('grp_'+name);
  if(!wrap) return multi? [] : '';
  const on = [...wrap.querySelectorAll('.chip.on')].map(c=>c.textContent);
  return multi ? on : (on[0]||'');
}

/* ---------------- SECTION BUILDERS ---------------- */

function sec_id(){
  return `
  <div class="card">
    <h2><span class="idx">A</span> Patient Identification</h2>
    <div class="row3">
      <div class="field"><label>Patient Name</label><input type="text" id="p_name"></div>
      <div class="field"><label>MRN</label><input type="text" id="p_mrn"></div>
      <div class="field"><label>Age (yrs)</label><input type="number" id="p_age" min="0" max="120" oninput="onAgeTyped()"></div>
    </div>
    <div class="row3">
      <div class="field"><label>Sex</label><select id="p_sex" onchange="calcRenalDosing();renderVentSuggestion();"><option value="">—</option><option value="M">Male</option><option value="F">Female</option></select></div>
      <div class="field"><label>Date of Birth <span style="font-weight:400;color:var(--ink-soft,#7a8699);">(auto-fills age)</span></label><input type="date" id="p_dob" onchange="onDobPicked()"></div>
      <div class="field"><label>Contact / Next of Kin</label><input type="text" id="p_nok"></div>
    </div>
  </div>
  <div class="card">
    <h2><span class="idx">B</span> Admission Details</h2>
    <div class="row3">
      <div class="field"><label>Date</label><input type="date" id="a_date"></div>
      <div class="field"><label>Time</label><input type="time" id="a_time"></div>
      <div class="field"><label>ICU / Bed</label><input type="text" id="a_bed"></div>
    </div>
    <label>Source of Admission</label>
    ${chipGroup('source',['ED','Ward transfer','OT / Post-op','Inter-hospital transfer','Direct / OPD'])}
    <div class="row">
      <div class="field"><label>Referring team / physician</label><input type="text" id="a_ref"></div>
      <div class="field"><label>Receiving ICU physician</label><input type="text" id="a_rec"></div>
    </div>
    <div class="note">Trimmed from the original: insurance/payment class and duplicate signature blocks removed from this section — retained once under Signatures (Sec. 11) only.</div>
  </div>`;
}

function sec_dx(){
  return `
  <div class="card">
    <h2><span class="idx">C</span> Diagnosis</h2>
    <div class="field"><label>Primary diagnosis / reason for ICU admission</label><textarea id="dx_primary"></textarea></div>
    <div class="field"><label>Key comorbidities / secondary diagnoses</label><textarea id="dx_secondary"></textarea></div>
  </div>
  <div class="card">
    <h2><span class="idx">D</span> ICU Admission Criteria <span style="font-weight:400;font-size:11px;color:var(--ink-soft)">(SCCM prioritisation model — tap all that apply)</span></h2>
    <div class="chip-group" id="grp_indications" data-multi="1">
      ${['Invasive mechanical ventilation','NIV / HFNC >3h','Vasopressor or inotrope requirement','Hemodynamic instability post-fluids',
         'GCS decline / new AMS','SpO\u2082 <90% on \u226550% O\u2082','RR >35 or labored breathing','pH <7.30 or PaCO\u2082 >50',
         'Lactate >2 mmol/L, not clearing','AKI needing CRRT','Multi-organ dysfunction (\u22652 systems)','High-risk post-op',
         'Sepsis / septic shock','Cardiac arrest with ROSC','Close neuro monitoring','Other']
        .map(o=>`<span class="chip crit-candidate" data-group="indications" onclick="toggleChip(this)">${o}</span>`).join('')}
    </div>
    <div id="critFlag"></div>
    <div class="note">Framework updated to the current SCCM prioritisation/admission-criteria approach (physiologic need for organ support or close monitoring) rather than the older rigid checklist — reduces box-ticking, keeps clinical judgement central.</div>
  </div>`;
}

function sec_hist(){
  return `
  <div class="card">
    <h2><span class="idx">E</span> History <span style="font-weight:400;font-size:11px;color:var(--ink-soft)">(condensed — full ROS folded into Exam)</span></h2>
    <div class="field"><label>Chief complaint / HPI</label><textarea id="h_hpi" style="min-height:80px;"></textarea></div>
    <label>Past medical history</label>
    <div class="chip-group" data-multi="1" id="grp_pmh">
      ${['HTN','DM','IHD','Heart failure','AF','COPD/Asthma','CKD','Cirrhosis','Malignancy','Immunosuppressed','Stroke/TIA','Seizure disorder','Substance use']
        .map(o=>`<span class="chip" data-group="pmh" onclick="toggleChip(this)">${o}</span>`).join('')}
    </div>
    <div class="row">
      <div class="field"><label>Allergies</label><input type="text" id="h_allergy" placeholder="NKDA or specify"></div>
      <div class="field"><label>Current medications</label><input type="text" id="h_meds"></div>
    </div>
  </div>`;
}

function sec_exam(){
  return `
  <div class="card">
    <h2><span class="idx">F</span> Vital Signs <span style="font-weight:400;font-size:11px;color:var(--ink-soft)">(derived values auto-calculate)</span></h2>
    <div class="row4">
      <div class="field"><label>Temp °F</label><input type="number" step="0.1" id="v_temp" min="70" max="115"></div>
      <div class="field"><label>HR bpm</label><input type="number" id="v_hr" min="0" max="300" oninput="calcMAP()"></div>
      <div class="field"><label>SBP</label><input type="number" id="v_sbp" min="0" max="300" oninput="calcMAP()"></div>
      <div class="field"><label>DBP</label><input type="number" id="v_dbp" min="0" max="250" oninput="calcMAP()"></div>
    </div>
    <div class="row4">
      <div class="field"><label>RR /min</label><input type="number" id="v_rr" min="0" max="80"></div>
      <div class="field"><label>SpO\u2082 %</label><input type="number" id="v_spo2" min="0" max="100"></div>
      <div class="field"><label>Weight kg</label><input type="number" id="v_wt" min="0" max="400" oninput="calcBMI()"></div>
      <div class="field"><label>Height</label>
        <div style="display:flex;gap:6px;">
          <input type="number" id="v_ht" min="0" max="250" oninput="calcBMI()" placeholder="e.g. 170" style="flex:1;">
          <select id="v_ht_unit" onchange="calcBMI()" style="flex:0 0 62px;">
            <option value="cm">cm</option>
            <option value="in">in</option>
          </select>
        </div>
      </div>
    </div>
    <div class="row3">
      <div class="field"><label>MAP (auto)</label><input type="text" id="v_map" readonly style="background:#eef4f2;font-family:var(--mono);"></div>
      <div class="field"><label>BMI (auto)</label><input type="text" id="v_bmi" readonly style="background:#eef4f2;font-family:var(--mono);"></div>
      <div class="field"><label>Pain (0-10)</label><input type="number" min="0" max="10" id="v_pain"></div>
    </div>
    <div id="shockIndexBox"></div>
    <div class="subhead">Glasgow Coma Scale</div>
    <div class="row3">

let customLabs = [];
function addCustomLab(){
  const name = val('clNewName').trim();
  const unit = val('clNewUnit').trim();
  if(!name) return;
  customLabs.push({ id: 'cl_'+Date.now()+'_'+Math.floor(Math.random()*1000), name, unit });
  setVal('clNewName',''); setVal('clNewUnit','');
  renderCustomLabs();
  document.getElementById('clNewName').focus();
}
function removeCustomLab(id){
  customLabs = customLabs.filter(c=>c.id!==id);
  renderCustomLabs();
  updateProgress();
}
function renderCustomLabs(){
  const box = document.getElementById('customLabsBox');
  if(!box) return;
  if(!customLabs.length){ box.innerHTML=''; return; }
  box.innerHTML = `<table class="mini"><thead><tr><th>Parameter</th><th>Unit</th><th>Value</th><th></th></tr></thead><tbody>
    ${customLabs.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.unit)}</td><td><input type="number" step="0.01" id="${c.id}_val" oninput="updateProgress()"></td><td><span onclick="removeCustomLab('${c.id}')" role="button" tabindex="0" aria-label="Remove ${esc(c.name)}" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();removeCustomLab('${c.id}')}" style="cursor:pointer;color:var(--red);font-weight:800;padding:0 4px;">&times;</span></td></tr>`).join('')}
  </tbody></table>`;
}
function collectCustomLabs(){
  return customLabs.map(c=>{
    const v = val(c.id+'_val');
    if(!v || v.trim()==='') return null;
    return [ c.name + (c.unit?` (${c.unit})`:''), v ];
  }).filter(Boolean);
}

const VENT_PRESETS = {

  normal:{label:'Normal / Post-op',tvLowMult:6,tvHighMult:8,rr:'12\u201316/min',peep:'5 cmH\u2082O',fio2:'30\u201340%, titrate for SpO\u2082 \u226594%',ie:'1:2',mode:'VC, PRVC or SIMV'}

function calcIBW(){
  const htCm=+val('v_ht'); const sex=val('p_sex');
  if(!htCm) return null;
  const inches = htCm/2.54;
  if(inches<55) return null;
  const base = sex==='F'?45.5:50;
  return +(base + 2.3*(inches-60)).toFixed(1);
}
function renderVentSuggestion(){
  const box = document.getElementById('ventSuggestBox');
  if(!box) return;
  const chosen = [...document.querySelectorAll('#grp_ventpreset .chip.on')].map(c=>c.textContent)[0];
  if(!chosen){ box.innerHTML=''; return; }
  const key = chosen.startsWith('ARDS')?'ards':(chosen.startsWith('COPD')?'copd':'normal');
  const p = VENT_PRESETS[key];
  const ibw = calcIBW();
  const tv = ibw? `${Math.round(ibw*p.tvLowMult)}\u2013${Math.round(ibw*p.tvHighMult)} mL (IBW ${ibw} kg)` : 'Enter height (Sec. F) & sex (Sec. A) for IBW-based target';
  box.innerHTML = `<div class="calc-box">

}

/* ---------------- CALCULATORS ---------------- */
function calcMAP(){
  const s=+val('v_sbp'), d=+val('v_dbp'), hr=+val('v_hr');
  if(s&&d){ const map=Math.round((s+2*d)/3); setVal('v_map', map+' mmHg'); } else setVal('v_map','');

  const box = document.getElementById('shockIndexBox');
  if(box){
    if(hr && s){
      const si = (hr/s).toFixed(2);
      let level = 'normal', msg = 'Normal range.';
      if(si>=1.0){ level='high'; msg='Markedly elevated \u2014 strongly suggests occult hypoperfusion/shock even if BP looks reassuring.'; }
      else if(si>=0.7){ level='mid'; msg='Elevated \u2014 possible early/compensated shock; correlate with lactate and perfusion.'; }
      box.innerHTML = `<div class="note" style="${level==='high'?'border-left-color:var(--red);background:#fbeae6;':(level==='mid'?'border-left-color:var(--amber);background:#fdf3e3;':'')}"><b>Shock Index (HR/SBP): ${si}</b> \u2014 ${msg}</div>`;
    } else { box.innerHTML=''; }
  }
  calcSOFA(); calcAPACHE();
  updateProgress();
}
function calcBMI(){
  const w=+val('v_wt'), hRaw=+val('v_ht'), hUnit=val('v_ht_unit')||'cm';
  const hCm = (window.ClinicalCalc ? ClinicalCalc.heightToCm(hRaw, hUnit) : (hUnit==='in'?hRaw*2.54:hRaw));
  if(w && hCm){
    const bmi = window.ClinicalCalc ? ClinicalCalc.calcBMI(w, hCm) : +(w/((hCm/100)**2)).toFixed(1);
    setVal('v_bmi', bmi + (window.ClinicalCalc ? ' ('+ClinicalCalc.bmiCategory(bmi)+')' : ''));
  } else setVal('v_bmi','');
  calcRenalDosing();
  renderVentSuggestion();
}
function calcAgeFromDob(dobStr){
  if(!dobStr) return null;
  const dob = new Date(dobStr+'T00:00:00');
  if(isNaN(dob.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - dob.getFullYear();
  const m = today.getMonth() - dob.getMonth();
  if(m < 0 || (m === 0 && today.getDate() < dob.getDate())) age--;
  return age >= 0 ? age : null;
}
function onDobPicked(){
  const dobStr = val('p_dob');
  const age = calcAgeFromDob(dobStr);
  const ageEl = document.getElementById('p_age');
  if(age != null){
    ageEl.value = age;
    ageEl.readOnly = true;
    ageEl.style.background = '#eef4f2';
    ageEl.title = 'Auto-filled from Date of Birth. Clear the DOB field to enter age manually.';
  }
  syncAge();
}
function onAgeTyped(){
  // If the user manually edits Age directly, DOB can no longer be trusted as the source — clear it to avoid a mismatch.
  const dobEl = document.getElementById('p_dob');

}

function calcGCS(){

function calcPF(){
  const pao2=+val('abg_pao2'), fio2=+val('abg_fio2');
  const box=document.getElementById('pfInterp');
  if(pao2 && fio2){
    const pf = Math.round(pao2/fio2);
    document.getElementById('pfRatio').textContent = pf;
    let cat, cls;
    const peep=+val('abg_peep')||0;
    if(peep<5){ cat='PEEP <5 cmH\u2082O entered — Berlin ARDS grading requires PEEP \u22655; ratio shown for reference only.'; }
    else if(pf>300){ cat='No ARDS by oxygenation criterion.'; }
    else if(pf>200){ cat='Mild ARDS range (Berlin).'; }
    else if(pf>100){ cat='Moderate ARDS range (Berlin).'; }
    else { cat='Severe ARDS range (Berlin).'; }
    box.textContent = cat;
  } else { document.getElementById('pfRatio').textContent='—'; box.textContent='Enter PaO\u2082 and FiO\u2082 to classify.'; }

function val(id){ const e=document.getElementById(id); return e? e.value : ''; }
function setVal(id,v){ const e=document.getElementById(id); if(e) e.value=v; }

function calcQSOFA(){
  const rr=+val('v_rr'), sbp=+val('v_sbp');
  const gcsEl=document.getElementById('gcsTotal');
  const gcs = gcsEl? +gcsEl.textContent : 15;
  let pts=0;
  if(rr>=22) pts++;
  if(sbp>0 && sbp<=100) pts++;
  if(gcs<15) pts++;
  const t=document.getElementById('qsofaVal'); if(!t) return;
  t.textContent = pts;
  document.getElementById('qsofaInterp').innerHTML = pts>=2
    ? '<span class="badge high">\u22652: high risk</span> — consider full SOFA, sepsis work-up and escalation.'
    : '<span class="badge low">0\u20131: lower risk</span> by qSOFA alone — does not exclude sepsis; use clinical judgement.';
  updateStickyBar();
}

function sofaResp(pf){
  if(pf==null) return 0;
  if(pf>=400) return 0; if(pf>=300) return 1; if(pf>=200) return 2; if(pf>=100) return 3; return 4;
}
function sofaCoag(plt){
  if(!plt) return 0;
  if(plt>=150) return 0; if(plt>=100) return 1; if(plt>=50) return 2; if(plt>=20) return 3; return 4;
}
function sofaLiver(bili){ // umol/L
  if(!bili) return 0;
  if(bili<20) return 0; if(bili<33) return 1; if(bili<102) return 2; if(bili<204) return 3; return 4;
}
function sofaRenal(cr, uo){ // cr umol/L, uo mL/24h
  let ptsCr=0;
  if(cr){ if(cr<110) ptsCr=0; else if(cr<171) ptsCr=1; else if(cr<300) ptsCr=2; else if(cr<440) ptsCr=3; else ptsCr=4; }
  let ptsUo=0;
  if(uo){ if(uo<200) ptsUo=4; else if(uo<500) ptsUo=3; }
  return Math.max(ptsCr, ptsUo);
}
function sofaCV(tier, map){
  // tier index 0-4 per chip order
  if(tier===4) return 4;
  if(tier===3) return 3;
  if(tier===2) return 2;
  if(tier===1) return 1;
  if(map && map<70) return 1;
  return 0;
}
function sofaCNS(gcs){
  if(gcs===15) return 0; if(gcs>=13) return 1; if(gcs>=10) return 2; if(gcs>=6) return 3; return 4;
}

function calcSOFA(){
  const target=document.getElementById('sofaVal'); if(!target) return;
  const pao2=+val('abg_pao2'), fio2=+val('abg_fio2');
  const pf = (pao2&&fio2)? pao2/fio2 : null;
  const plt=+val('l_plt'), bili=+val('l_bili'), cr=+val('l_cr'), uo=+val('s_uo');
  const gcsEl=document.getElementById('gcsTotal'); const gcs = gcsEl? +gcsEl.textContent : 15;
  const mapv = +((val('v_map')||'').replace(/[^0-9]/g,'')) || null;
  const cvChips = [...document.querySelectorAll('#grp_cv .chip')];
  let cvTier = -1;
  cvChips.forEach((c,i)=>{ if(c.classList.contains('on')) cvTier=i; });

  const r = sofaResp(pf), c = sofaCoag(plt), l = sofaLiver(bili), cv = sofaCV(cvTier, mapv), cns = sofaCNS(gcs), ren = sofaRenal(cr, uo);
  const total = r+c+l+cv+cns+ren;
  target.textContent = total;
  document.getElementById('sofaBreakdown').innerHTML =
    `Resp ${r} · Coag ${c} · Liver ${l} · CV ${cv} · CNS ${cns} · Renal ${ren}`;
  let mort;
  if(total<=6) mort='mortality generally <10%';
  else if(total<=9) mort='mortality roughly 15\u201320%';
  else if(total<=12) mort='mortality roughly 40\u201350%';
  else if(total<=14) mort='mortality roughly 50\u201360%';
  else mort='mortality >80%';
  document.getElementById('sofaMortality').textContent = `Approximate association: ${mort} (trend the score serially — a rising SOFA in the first 48h matters more than the single value).`;
  updateStickyBar();
}

/* ---- APACHE II ---- */
function apAge(age){
  if(age<44) return 0; if(age<54) return 2; if(age<64) return 3; if(age<74) return 5; return 6;
}
function apTemp(t){
  if(!t) return 0;
  if(t>=41) return 4; if(t>=39) return 3; if(t>=38.5) return 1; if(t>=36) return 0; if(t>=34) return 1; if(t>=32) return 2; if(t>=30) return 3; return 4;
}
function apMAPpts(m){
  if(!m) return 0;
  if(m>=160) return 4; if(m>=130) return 3; if(m>=110) return 2; if(m>=70) return 0; if(m>=50) return 2; return 4;
}
function apHR(h){
  if(!h) return 0;
  if(h>=180) return 4; if(h>=140) return 3; if(h>=110) return 2; if(h>=70) return 0; if(h>=55) return 2; if(h>=40) return 3; return 4;
}
function apRR(r){
  if(!r) return 0;
  if(r>=50) return 4; if(r>=35) return 3; if(r>=25) return 1; if(r>=12) return 0; if(r>=10) return 1; if(r>=6) return 2; return 4;
}
function apOxy(fio2, pao2){
  if(!fio2) return 0;
  if(fio2>=0.5){
    // approximate A-aDO2 using assumed PAtm 760, PH2O 47, RQ .8: PAO2 = FiO2*(760-47) - PaCO2/0.8
    const paco2 = +val('abg_paco2')||40;
    const pAO2 = fio2*(760-47) - paco2/0.8;
    const aad = pAO2 - (pao2||0);
    if(aad>=500) return 4; if(aad>=350) return 3; if(aad>=200) return 2; return 0;
  } else {
    if(!pao2) return 0;
    if(pao2<55) return 4; if(pao2<61) return 3; if(pao2<71) return 1; return 0;
  }
}
function apPH(ph){
  if(!ph) return 0;
  if(ph>=7.7) return 4; if(ph>=7.6) return 3; if(ph>=7.5) return 1; if(ph>=7.33) return 0; if(ph>=7.25) return 2; if(ph>=7.15) return 3; return 4;
}
function apNa(na){
  if(!na) return 0;
  if(na>=180) return 4; if(na>=160) return 3; if(na>=155) return 2; if(na>=150) return 1; if(na>=130) return 0; if(na>=120) return 2; if(na>=111) return 3; return 4;
}
function apK(k){
  if(!k) return 0;
  if(k>=7) return 4; if(k>=6) return 3; if(k>=5.5) return 1; if(k>=3.5) return 0; if(k>=3) return 1; if(k>=2.5) return 2; return 4;
}
function apCr(cr_umol, aki){
  if(!cr_umol) return 0;
  const cr = cr_umol/88.4; // to mg/dL
  let pts;
  if(cr>=3.5) pts=4; else if(cr>=2.0) pts=3; else if(cr>=1.5) pts=2; else if(cr>=0.6) pts=0; else pts=2;
  return aki? pts*2 : pts;
}
function apHct(h){
  if(!h) return 0;
  if(h>=60) return 4; if(h>=50) return 2; if(h>=46) return 1; if(h>=30) return 0; if(h>=20) return 2; return 4;
}
function apWBC(w){
  if(!w) return 0;
  if(w>=40) return 4; if(w>=20) return 2; if(w>=15) return 1; if(w>=3) return 0; if(w>=1) return 2; return 4;
}
function apGCSpts(gcs){ return 15-(gcs==null?15:gcs); }

function calcAPACHE(){
  const target=document.getElementById('apacheVal'); if(!target) return;
  const age=+val('ap_age');
  const tempF=+val('v_temp'), temp=tempF?(tempF-32)*5/9:0, map=+((val('v_map')||'').replace(/[^0-9]/g,''))||0, hr=+val('v_hr'), rr=+val('v_rr');
  const fio2=+val('abg_fio2'), pao2=+val('abg_pao2'), ph=+val('abg_ph');
  const na=+val('l_na'), k=+val('l_k'), cr=+val('l_cr');
  const hct=+val('ap_hct'), wbc=+val('ap_wbc');
  const gcsEl=document.getElementById('gcsTotal'); const gcs=gcsEl?+gcsEl.textContent:15;

  const akiFlag = ([...document.querySelectorAll('[data-group="arf"].chip.on')].map(c=>c.textContent)[0]||'').startsWith('Yes');
  const pts = apAge(age)+apTemp(temp)+apMAPpts(map)+apHR(hr)+apRR(rr)+apOxy(fio2,pao2)+apPH(ph)+apNa(na)+apK(k)+apCr(cr,akiFlag)+apHct(hct)+apWBC(wbc)+apGCSpts(gcs);

  const chronicWrap = document.getElementById('grp_apchronic');
  let chronicPts=0;
  if(chronicWrap){
    const sel = chronicWrap.querySelector('.chip.on');
    if(sel){
      const txt = sel.textContent;
      if(txt.startsWith('Nonoperative')) chronicPts=5;
      else if(txt.startsWith('Elective')) chronicPts=2;
    }
  }
  const total = pts+chronicPts;
  target.textContent = total;
  let mortText;
  if(total<=9) mortText='~4–8%'; else if(total<=14) mortText='~15–20%'; else if(total<=19) mortText='~25–35%';
  else if(total<=24) mortText='~40–55%'; else if(total<=29) mortText='~55–75%'; else mortText='>80%';
  document.getElementById('apacheMortality').textContent = `Approximate predicted hospital mortality: ${mortText} (Knaus 1985 reference bands — treat as a rough guide, not a precise individual prediction).`;
  updateStickyBar();
}

/* ---------------- RENAL FUNCTION / DOSING REFERENCE ---------------- */
// Self-contained fallbacks — used only if shared/clinical-calc.js failed to load
// (e.g. testing this file standalone, outside the full ED-Suite folder structure).
function fallbackCockcroftGault(age, wt, sex, cr_umol){
  const cr_mgdl = cr_umol/88.4;
  let crcl = ((140-age)*wt)/(72*cr_mgdl);
  if(String(sex).toUpperCase().charAt(0)==='F') crcl *= 0.85;
  return Math.round(crcl);
}
function fallbackCkdEpi2021(age, sex, cr_umol){
  const cr_mgdl = cr_umol/88.4;
  const isFemale = String(sex).toUpperCase().charAt(0)==='F';
  const k = isFemale?0.7:0.9, a = isFemale?-0.241:-0.302, sexFactor = isFemale?1.012:1.0;
  const minR = Math.min(cr_mgdl/k,1), maxR = Math.max(cr_mgdl/k,1);
  return Math.round(142 * Math.pow(minR,a) * Math.pow(maxR,-1.200) * Math.pow(0.9938,age) * sexFactor);
}
function fallbackRenalBand(v){
  if(v>=90) return 'Normal / high (\u226590)';
  if(v>=60) return 'Mildly decreased (60\u201389)';
  if(v>=45) return 'Mild-moderate decrease (45\u201359)';
  if(v>=30) return 'Moderate-severe decrease (30\u201344)';
  if(v>=15) return 'Severely decreased (15\u201329)';
  return 'Kidney failure (<15) / consider CRRT-HD range';
}
function calcRenalDosing(){
  const crclEl = document.getElementById('crclVal');
  if(!crclEl) return;
  const age=+val('p_age')||+val('ap_age'), wt=+val('v_wt'), sex=val('p_sex'), cr_umol=+val('l_cr');
  const tableBox = document.getElementById('renalDoseTable');
  const ckdepiEl = document.getElementById('ckdepiVal');
  const haveEpiInputs = age && sex && cr_umol;
  const haveCgInputs = age && wt && sex && cr_umol;
  if(!haveEpiInputs && !haveCgInputs){
    crclEl.textContent='—';
    document.getElementById('crclInterp').textContent = 'Enter age, sex, weight (Sec. F) and creatinine (Sec. H) to estimate.';
    if(ckdepiEl){ ckdepiEl.textContent='—'; document.getElementById('ckdepiInterp').textContent='Enter age, sex and creatinine (Sec. H) to estimate.'; }
    if(tableBox) tableBox.innerHTML='';
    renderAbxList();
    return;
  }
  let crcl=null, band='', epi=null, epiBand='';
  if(haveCgInputs){
    crcl = window.ClinicalCalc ? ClinicalCalc.cockcroftGault(age, wt, sex, cr_umol) : fallbackCockcroftGault(age, wt, sex, cr_umol);
    band = window.ClinicalCalc ? ClinicalCalc.renalBand(crcl) : fallbackRenalBand(crcl);
  }
  if(haveEpiInputs){
    epi = window.ClinicalCalc ? ClinicalCalc.ckdEpi2021(age, sex, cr_umol) : fallbackCkdEpi2021(age, sex, cr_umol);
    epiBand = window.ClinicalCalc ? ClinicalCalc.renalBand(epi) : fallbackRenalBand(epi);
  }
  if(crcl!=null){
    crclEl.textContent = crcl+' mL/min';
    document.getElementById('crclInterp').textContent = `Cockcroft-Gault — ${band}. Actual body weight used; consider adjusted body weight if obese.`;
  } else {
    crclEl.textContent = '—';
    document.getElementById('crclInterp').textContent = 'Enter weight (Sec. F) as well to estimate Cockcroft-Gault.';
  }
  if(ckdepiEl){
    if(epi!=null){
      ckdepiEl.textContent = epi+' mL/min/1.73m\u00b2';
      document.getElementById('ckdepiInterp').textContent = `CKD-EPI 2021 (race-free) — ${epiBand}. Not weight-based; may differ from Cockcroft-Gault at extremes of body size.`;
    } else {
      ckdepiEl.textContent = '—';
      document.getElementById('ckdepiInterp').textContent = 'Enter age, sex and creatinine (Sec. H) to estimate.';
    }
  }
  if(crcl==null){ if(tableBox) tableBox.innerHTML=''; renderAbxList(); return; }

  const doses = {
    'Piperacillin-tazobactam': crcl>=40?'4.5 g IV q6h':(crcl>=20?'3.375\u20134.5 g IV q8h':'2.25 g IV q6h (extended infusion preferred)'),
    'Meropenem': crcl>=50?'1 g IV q8h':(crcl>=25?'1 g IV q12h':(crcl>=10?'500 mg IV q12h':'500 mg IV q24h (post-HD on dialysis days)')),
    'Vancomycin': 'Load 25\u201330 mg/kg once regardless of CrCl \u2014 maintenance dosed by level/AUC, not by this band.',
    'Levofloxacin': crcl>=50?'750 mg IV/PO q24h':(crcl>=20?'750 mg once, then 750 mg q48h':'750 mg once, then 500 mg q48h'),
    'Colistin / Gentamicin': 'Specialist / pharmacokinetic dosing (Garonzik equation, extended-interval nomogram) \u2014 do not band by CrCl alone; consult pharmacy.'
  };
  if(tableBox){
    tableBox.innerHTML = `<table class="mini"><thead><tr><th>Agent</th><th>Suggested adjustment</th></tr></thead><tbody>
      ${Object.entries(doses).map(([k,v])=>`<tr><td style="white-space:nowrap;">${k}</td><td>${v}</td></tr>`).join('')}
    </tbody></table>`;
  }
  renderAbxList();
}

function collectFilled(){
  const by = {};
  const add = (section,label,value)=>{ if(!by[section]) by[section]=[]; by[section].push([label,value]); };
  FIELD_MAP.forEach(([id,label,section])=>{
    const v = val(id);
    if(v && v.trim()!=='') add(section,label,v);
  });
  CHIP_GROUPS.forEach(([grp,label,section])=>{
    const chosen = [...document.querySelectorAll(`[data-group="${CSS.escape(grp)}"].chip.on`)].map(c=>c.textContent);
    if(chosen.length) add(section,label,chosen.join(', '));
  });
  collectCustomLabs().forEach(([label,value])=>add('Labs__full',label,value));
  collectSelectedAbx().forEach(line=>add('Plan__full','Antibiotic',line));
  return by;
}

function collectScores(){
  const s = {};
  const gcs = document.getElementById('gcsTotal'); if(gcs) s.GCS = gcs.textContent;
  const q = document.getElementById('qsofaVal'); if(q) s.qSOFA = q.textContent;
  const pf = document.getElementById('pfRatio'); if(pf && pf.textContent!=='\u2014') s['PaO\u2082/FiO\u2082'] = pf.textContent;
  const sofa = document.getElementById('sofaVal'); if(sofa && sofa.textContent!=='\u2014') s.SOFA = sofa.textContent;
  const ap = document.getElementById('apacheVal'); if(ap && ap.textContent!=='\u2014' && val('ap_age')) s['APACHE II'] = ap.textContent;
  const crcl = document.getElementById('crclVal'); if(crcl && crcl.textContent!=='\u2014') s['Est. CrCl (Cockcroft-Gault)'] = crcl.textContent;
  const hr=+val('v_hr'), sbp=+val('v_sbp'); if(hr && sbp) s['Shock Index (HR/SBP)'] = (hr/sbp).toFixed(2);
  return s;
}

function collectBundle(){

/* ---------------- OUTPUT: PRINT / PDF ---------------- */
function doPrint(){
  const html = generateNoteHTML();
  // Use hidden iframe approach — avoids popup blockers and CSS loading issues
  let iframe = document.getElementById('printIframe');
  if(!iframe){
    iframe = document.createElement('iframe');
    iframe.id = 'printIframe';
    iframe.style.cssText = 'position:fixed;width:0;height:0;border:none;left:-9999px;';
    document.body.appendChild(iframe);
  }
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  let printed = false;
  const triggerPrint = ()=>{
    if(printed) return;
    printed = true;
    try{ iframe.contentWindow.focus(); iframe.contentWindow.print(); }catch(e){ showToast('Print failed — try Word export instead'); }
  };
  if(HW_STYLE && doc.fonts && doc.fonts.ready){
    doc.fonts.ready.then(triggerPrint).catch(triggerPrint);
    setTimeout(triggerPrint, 1500);
  } else {
    // Give the iframe a moment to render
    setTimeout(triggerPrint, 500);
  }
}

  return out;
}

function resetAll(){
  if(!confirm('Clear all entered data on this form?')) return;
  customLabs = []; selectedAbx = new Set();
  document.querySelectorAll('input,textarea').forEach(i=>{ if(i.type!=='checkbox') i.value=''; else i.checked=false; });
  document.querySelectorAll('select').forEach(s=>s.selectedIndex=0);
  document.querySelectorAll('.chip.on').forEach(c=>c.classList.remove('on','crit'));
  ['gcsTotal'].forEach(id=>{const e=document.getElementById(id); if(e)e.textContent='15';});
  ['sofaVal','apacheVal','qsofaVal','pfRatio','crclVal'].forEach(id=>{const e=document.getElementById(id); if(e)e.textContent='\u2014';});
  buildSections(); // re-render bundle defaults etc.
  updateProgress();
  updateStickyBar();
  if (icuAutoSave) icuAutoSave.clear();
  showToast('Form cleared');
}

/* ---------------- AUTO-SAVE / SESSION RECOVERY ----------------
   Fixes: refresh, tab switch, or phone lock previously wiped every
   field on this form (no persistence layer existed). Debounced
   auto-save to localStorage + restore-on-load, so an interrupted
   admission workflow can be resumed. */
const icuAutoSave = (typeof AutoSave !== 'undefined') ? AutoSave.attach('icu_admission_autosave_v1', {
  extra: () => ({ customLabs, selectedAbx: [...selectedAbx] }),
  beforeRestore: (data) => {
    if (data.extra) {
      if (Array.isArray(data.extra.customLabs)) { customLabs = data.extra.customLabs; renderCustomLabs(); }
      if (Array.isArray(data.extra.selectedAbx)) { selectedAbx = new Set(data.extra.selectedAbx); renderAbxList(); }
    }
  },
  afterRestore: () => {
    calcMAP(); calcBMI(); calcGCS(); calcPF(); calcQSOFA(); calcSOFA(); calcAPACHE(); calcRenalDosing();
    renderICUCriteriaFlag(); renderVentSuggestion();
    updateProgress(); updateStickyBar();
    showToast('Restored your last unsaved session');
  }
}) : null;

/* ---------------- INIT ---------------- */
document.addEventListener('input', updateProgress);
buildTabs();
buildSections();
(function setNow(){
  const now = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const dEl=document.getElementById('a_date'); if(dEl) dEl.value = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
  const tEl=document.getElementById('a_time'); if(tEl) tEl.value = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
})();
calcQSOFA();
calcRenalDosing();
updateProgress();
updateStickyBar();
if (icuAutoSave) icuAutoSave.restore();
if('serviceWorker' in navigator){navigator.serviceWorker.register('../../sw.js').catch(()=>{})}
</script>
</body>
